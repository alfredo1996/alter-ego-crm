# Keeps the SHA-pinned actions in .github/workflows current: one grouped PR a week.
# Dependabot opens its PRs against target-branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
