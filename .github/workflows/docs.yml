name: Documentation

# The build runs on every change to the docs so a broken page is caught in review.
# A push to main that changes the docs also publishes the site to GitHub Pages.
on:
  pull_request:
    branches: [main]
    paths:
      - "content/docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs-site
        # A project site is served from /<repo>, so the base path has to match or
        # every asset 404s. Unset it for a user or organisation site.
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      - name: Check the export actually produced pages
        working-directory: docs-site
        run: |
          count=$(find out -name index.html | wc -l)
          echo "$count pages"
          # 20 MDX files across two languages, plus the root and language redirects.
          # Change this when a page is added or removed.
          if [ "$count" -ne 23 ]; then
            echo "::error::Expected 23 pages, found $count"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/out

  deploy:
    name: Publish to Pages
    # Every push to main that changes the docs publishes them; a manual run does too.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
