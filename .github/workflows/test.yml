name: Unit Tests

# Feature branches are tested through their PR, not on every push: a push
# trigger on them ran each workflow twice per commit. pull_request has no
# branch filter, so a PR stacked on another feature branch is tested too.
on:
  push:
    branches: [main, dev]
  pull_request:

# One run per PR (or branch): a new push to a PR cancels its superseded run.
# A running main/dev run is never cancelled; GitHub keeps one queued run per
# group, so in a burst of merges the newest queued one replaces the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Fumadocs source
        run: pnpm --filter @alter-ego/web exec fumadocs-mdx

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # apps/web/vitest.config.ts has coverage thresholds; they are enforced here.
      - name: Unit tests (with coverage)
        run: pnpm --filter @alter-ego/web exec vitest run --coverage

      - name: Build
        run: pnpm build
