name: Unit Tests

# Feature branches are tested through their PR, not on every push: a push
# trigger on them ran each workflow twice per commit. pull_request has no
# branch filter, so a PR stacked on another feature branch is tested too.
on:
  push:
    branches: [main, dev]
  pull_request:

# One run per PR (or branch): a new push to a PR cancels its superseded run.
# A running main/dev run is never cancelled; GitHub keeps one queued run per
# group, so in a burst of merges the newest queued one replaces the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Fumadocs source
        run: pnpm --filter @alter-ego/web exec fumadocs-mdx

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # apps/web/vitest.config.ts has coverage thresholds; they are enforced here.
      - name: Unit tests (with coverage)
        run: pnpm --filter @alter-ego/web exec vitest run --coverage

      - name: Build
        run: pnpm build
